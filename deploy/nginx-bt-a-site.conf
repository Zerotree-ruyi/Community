# ══════════════════════════════════════════════════════════════════════════
# A 台(47.236.172.111 / coinbase-in.com)宝塔站点 nginx —— 增量补丁
#
# ⚠️ 这**不是**一份完整的 server 配置,是「在现有配置上改哪几处」。
#    整份覆盖会把 Let's Encrypt 的续签检查块和 497 跳转弄坏,
#    证书续期会失败。
#
# 线上现有配置长这样(从服务器上抄下来的):
#    server_name coinbase-in.com 47.236.172.111 coin-asia.cc;
#    root /www/wwwroot/trade;
#    location /api/ { proxy_pass http://47.236.95.137:3001; ... }   ← 直连 3001
#    location / { try_files $uri $uri/ /index.html; }
#
# 目标:
#    https://coinbase-in.com/            → 会员前台
#    https://coinbase-in.com/manager/    → 后台管理(登录页在 /manager/login)
#    裸 IP + 任意端口                      → 全部打不到
#
# 怎么用:
#   宝塔 → 网站 → coinbase-in.com → 设置 → 配置文件
#   照着下面「①改 /api/」「②加 /manager/」两段改,**别整份覆盖**。
#   改完宝塔会自己 nginx -t;报错了它会拒绝保存。
# ══════════════════════════════════════════════════════════════════════════

# 你的公网 IP(查 https://ip.sb)。家里宽带 IP 会变,变了就改这里。
#   💡 建议先把这几行注释掉,把整条链路验证通了再打开 ——
#      填错 IP 会把自己关在门外。
# ──────────────────────────────────────────────────────────────────────────
# ALLOW_ME = 1.2.3.4;      ← 换成你自己的公网 IP


# ══════════════════════════════════════════════════════════════════════════
# ① 改 location /api/ —— 端口 3001 → 80,并关掉 SSE 缓冲
# ══════════════════════════════════════════════════════════════════════════
#
#   改之前:
#       location /api/ {
#           proxy_pass http://47.236.95.137:3001;
#           ...
#           proxy_read_timeout    60s;
#           proxy_send_timeout    60s;
#       }
#
#   改之后:
    location /api/ {
        # 走 B 台的 80(而不是 3001)—— B 台 3001 关掉公网入站后,
        # 只有 B 台自己的 nginx 能访问它。
        proxy_pass http://47.236.95.137:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    60s;

        # SSE(后台改信用分 → 前台秒级更新)必须关缓冲,
        # 否则 nginx 会把数据攒着一起发,实时推送就退化成 15 秒轮询。
        proxy_buffering off;
        proxy_cache off;
    }


# ══════════════════════════════════════════════════════════════════════════
# ② 新增 /manager/ 四段 —— 放在 location / 那一段的前面
# ══════════════════════════════════════════════════════════════════════════
#
#   ⚠️ 必须用 ^~,否则会被后面的正则 location 抢走
#      (你现有配置里有 `location ~ .*\.(js|css)?$` 这种宽松正则)
#
#   server 级别已经有 root /www/wwwroot/trade; 所以直接用 try_files 就行,
#   不用 alias(后台文件放在 /www/wwwroot/trade/manager/)。

    # 不带斜杠访问 /manager → 301 到 /manager/
    location = /manager {
        return 301 /manager/;
    }

    # 后台静态资源(长缓存)
    location ^~ /manager/assets/ {
        # allow 1.2.3.4;      ← 换成你自己的公网 IP
        # deny all;

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台 SPA(目录入口)
    location ^~ /manager/ {
        # allow 1.2.3.4;      ← 换成你自己的公网 IP
        # deny all;

        try_files $uri $uri/ /manager/index.html;
        index index.html;
    }

    # 后台的 API —— 前缀 /manager/api 会被剥掉,B 台那边接的是 /api/xxx
    location ^~ /manager/api/ {
        # allow 1.2.3.4;      ← 换成你自己的公网 IP
        # deny all;

        proxy_pass http://47.236.95.137:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }


# ══════════════════════════════════════════════════════════════════════════
# ③(可选但建议)把 TLSv1.1 关掉
# ══════════════════════════════════════════════════════════════════════════
#
#   你现有配置里是:ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
#   TLSv1.1 早就被淘汰了,没有任何理由留着:
#
#       ssl_protocols TLSv1.2 TLSv1.3;
#
#   HSTS 建议补一个 always(现在这条没有 always,只在某些状态码下生效):
#
#       add_header Strict-Transport-Security "max-age=31536000" always;
#
# ⚠️ 确认全站 HTTPS 正常之后再开 HSTS —— HSTS 一旦下发,
#    浏览器会在 max-age 内强制 HTTPS,证书出问题就回不去了。
