# ══════════════════════════════════════════════════════════════════════════
# A 台(47.236.172.111 / coin-asia.cc)宝塔站点 nginx 配置
#
# A 台 = 公网唯一入口。有域名 + Let's Encrypt 证书(HTTPS 已通)。
# B 台(47.236.95.137)只跑后端和 MySQL,端口不再对公网开放。
#
# 目标:
#   https://coin-asia.cc/            → 会员前台
#   https://coin-asia.cc/manager/    → 后台管理(登录页在 /manager/login)
#   裸 IP + 任意端口                  → 全部打不到
#
# 怎么用:
#   宝塔 → 网站 → coin-asia.cc → 设置 → 配置文件
#   把下面标了「⬇️ 替换/新增 ⬇️」的部分合进去。
#   ⚠️ 现有的 location /api/ 那段要改 proxy_pass 的端口(3001 → 80),
#      原因:改完之后 B 台的 3001 就能彻底关掉,公网谁也碰不到后端。
# ══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name coin-asia.cc coinbase-in.com 47.236.172.111;
    index index.html;
    root /www/wwwroot/trade;

    #CERT-APPLY-CHECK-START
    include /www/server/panel/vhost/nginx/well-known/coinbase-in.com.conf;
    #CERT-APPLY-CHECK-END

    #SSL-START
    ssl_certificate     /www/server/panel/vhost/cert/coinbase-in.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/coinbase-in.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    #HTTP → HTTPS 强制跳转
    error_page 497 https://$host$request_uri;
    #SSL-END

    # ── 会员前台(已存在,保持) ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════════════════════════════
    # ⬇️ 新增:后台管理 —— 目录入口 /manager/ ⬇️
    #
    #   访问 http://47.236.172.111/manager/  →  会 403(不在白名单)
    #   访问 https://coin-asia.cc/manager/login → 你的 IP 才看得到后台登录页
    #
    #   白名单里填的是「你访问后台的那台电脑」的公网 IP,不是服务器的 IP。
    #   家里/公司宽带 IP 会变,变了就改这里,或者用下面的动态写法。
    # ══════════════════════════════════════════════════════════════════════

    location = /manager {
        return 301 /manager/;
    }

    location ^~ /manager/assets/ {
        # ── 换成你自己的公网 IP ────────────────────────────────────────────
        allow 1.2.3.4;
        deny all;

        alias /www/wwwroot/trade/manager/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /manager/ {
        # ── 换成你自己的公网 IP ────────────────────────────────────────────
        allow 1.2.3.4;
        deny all;

        alias /www/wwwroot/trade/manager/;
        try_files $uri $uri/ /manager/index.html;
        index index.html;
    }

    # 后台的 API —— 走 B 台。B 台 80 端口只放行 A 台,所以公网打不到这里
    location ^~ /manager/api/ {
        # ── 换成你自己的公网 IP ────────────────────────────────────────────
        allow 1.2.3.4;
        deny all;

        # 注意末尾的 /api/:把 /manager/api 前缀剥掉,B 台那边接的就是 /api/xxx
        proxy_pass http://47.236.95.137:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ══════════════════════════════════════════════════════════════════════
    # ⬇️ 替换:会员端 API —— 端口从 3001 改成 80(走 B 台 nginx) ⬇️
    #
    #   改完这个,B 台的 3001 端口就能在宝塔「安全」里关掉,
    #   公网直接输 http://47.236.95.137:3001 就连不上了。
    #
    #   ⚠️ 如果 B 台 nginx 那边还没配好,先别改这里 —— 改完前台会 502。
    # ══════════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://47.236.95.137:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # SSE(后台改信用分 → 前台秒级更新)必须关缓冲,否则数据会被攒着一起发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── 安全响应头 ────────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── 挡掉敏感文件(保留你原来的规则) ────────────────────────────────────
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.DS_Store|\.gitignore|README\.md|CLAUDE\.md|package(-lock)?\.json|\.log|\.sql(\.gz)?|docker-compose\.yml|\.bak(up)?|\.old|\.tmp)$ {
        return 404;
    }
    location ~* /(\.git|\.svn|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.cache|node_modules|runtime)/ {
        return 404;
    }

    client_max_body_size 2m;
}
