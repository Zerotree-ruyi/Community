# ══════════════════════════════════════════════════════════════════════════
# B 台(47.236.95.137)宝塔站点 nginx 配置片段
#
# B 台 = 只跑后端(3001)和 MySQL(3306),不对公网开这两个端口。
#   公网 → A 台(443) → B 台(80,只放行 A 台 IP) → 127.0.0.1:3001 → 127.0.0.1:3306
#
# 关键:location /api/ 里的 allow 只写 A 台的 IP。
#   没有这一句,公网直接输 http://47.236.95.137/api/... 一样能调到后端。
#
# 怎么用:
#   宝塔 → 网站 → B 台的站点 → 设置 → 配置文件 → 把下面这段加进 server { }
#   加完在宝塔「安全」里把 3001 / 3306 移除放行。
# ══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name 47.236.95.137;

    # ── 会员端 / 后台的 API ───────────────────────────────────────────────
    #    只接受 A 台(47.236.172.111)转发过来的请求 —— 其它一律 403
    location /api/ {
        # ── 这里是 A 台的 IP(不是你自己电脑的 IP) ─────────────────────────
        allow 47.236.172.111;
        deny all;

        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;

        # SSE 必须关缓冲(后台改信用分 → 前台秒级更新)
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 静态站点(如果 B 台也放了前台 dist) ────────────────────────────────
    location / {
        root /www/wwwroot/exchange-admin/dist;
        try_files $uri $uri/ /index.html;
    }

    # ── 敏感文件一律 404 ─────────────────────────────────────────────────
    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }
    location ~* \.(sql|log|bak)$ {
        deny all;
        return 404;
    }

    client_max_body_size 2m;
}
